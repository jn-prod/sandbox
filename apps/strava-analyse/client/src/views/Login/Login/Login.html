<div>
  <div class="row" v-if="error === 'MISSING_AUTH'">
    <div class="col-6 mx-auto">
      <div class="alert alert-danger" role="alert">Merci de vous authentifié.</div>
    </div>
  </div>
  <div class="row" v-if="!code">
    <div class="col-12 p-5 bg-light">
      <div class="row mt-5">
        <div class="col mb-5">
          <h1>Connexion</h1>
        </div>
      </div>
      <div class="row">
        <div class="col-sm-10 mx-auto">
          <p class="text-muted">
            <strong>Application optimisée pour :</strong>
          </p>
          <a
            :href="`${strava.baseUrl}/oauth/authorize?client_id=${strava.clientId}&response_type=code&redirect_uri=http%3A%2F%2Flocalhost%3A8080%2F%23%2Flogin&approval_prompt=force&scope=read_all,profile%3Aread_all,activity%3Aread`"
            class="btn btn-primary mt-2"
          >
            <!-- <font-awesome-icon :icon="['fab', 'fa-strava']" /> -->
            Se connecter avec<br />Strava
          </a>
        </div>
      </div>
      <div class="row mb-5">
        <div class="col-8 mt-5 mx-auto text-muted">
          Inscription en 5 secondes, sans formulaire avec votre réseau favoris.
        </div>
      </div>
    </div>
  </div>
  <div class="text-center" v-if="code">
    <b-spinner label="Spinning"></b-spinner>
  </div>
</div>
